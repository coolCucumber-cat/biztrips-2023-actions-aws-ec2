name: CI/CD auf AWS EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '24'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests ausführen
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Produktions-Build erstellen
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_IMGS: ${{ vars.VITE_IMGS || 'items' }}

      - name: Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy auf EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    # EC2-SSH-Key ist aktuell nicht eingerichtet; Fehler hier sollen den
    # nachgelagerten ECS-Deploy (docker -> deploy-ecs) nicht blockieren.
    continue-on-error: true
    steps:
      - name: Build-Artefakt herunterladen
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: SSH-Key einrichten
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Dateien auf EC2 übertragen
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/biztrips-build/"

      - name: Auf EC2 veröffentlichen
        run: |
          ssh -T -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" '
            set -euo pipefail
            sudo mkdir -p /var/www/biztrips
            sudo rsync -a --delete /tmp/biztrips-build/ /var/www/biztrips/
            sudo systemctl reload nginx
            rm -rf /tmp/biztrips-build
          ' < /dev/null

      - name: SSH-Key entfernen
        if: always()
        run: rm -f ~/.ssh/deploy_key

  docker:
    name: Docker-Image bauen und auf Docker Hub veröffentlichen
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Bei Docker Hub anmelden
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      # Tagging-Strategie: prod01 (aktuell auf Produktion deployt), latest (letzter
      # erfolgreicher Build) und die Git-Kurz-SHA (unveränderliche Referenz je Commit).
      - name: Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_IMGS=${{ vars.VITE_IMGS || 'items' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/biztrips:prod01
            ${{ secrets.DOCKERHUB_USERNAME }}/biztrips:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/biztrips:${{ github.sha }}

  deploy-ecs:
    name: Image nach ECR pushen und ECS-Service aktualisieren
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    steps:
      - uses: actions/checkout@v4

      # AWS-Academy-Learner-Lab-Fallback: Lab-Accounts erlauben kein iam:CreateRole /
      # iam:CreateOpenIDConnectProvider, daher hier die temporären Learner-Lab-
      # Zugangsdaten (AWS Details → AWS CLI im Lab) statt einer per OIDC übernommenen
      # Rolle. Diese Zugangsdaten laufen mit der Lab-Sitzung ab und müssen bei jeder
      # neuen Sitzung als GitHub Secrets im "production"-Environment aktualisiert werden.
      - name: AWS-Credentials aus Learner-Lab-Session beziehen
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Bei ECR anmelden
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # task-definition.json enthält einen Platzhalter-Account (123456789012) für
      # executionRoleArn, da die Learner-Lab-Account-ID sich pro Sitzung/Kurs
      # unterscheidet. Hier wird sie live über die aktuellen Zugangsdaten ermittelt
      # und in der Task-Definition ersetzt, statt sie manuell pflegen zu müssen.
      - name: Account-ID der Learner-Lab-Session ermitteln
        id: aws-account
        run: echo "id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: executionRoleArn in Task-Definition aktualisieren
        run: |
          sed -i "s#arn:aws:iam::[0-9]*:role/LabRole#arn:aws:iam::${{ steps.aws-account.outputs.id }}:role/LabRole#" task-definition.json

      - name: Image bauen und nach ECR pushen
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: biztrips
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL="${{ vars.VITE_API_BASE_URL }}" \
            --build-arg VITE_IMGS="${{ vars.VITE_IMGS || 'items' }}" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Task-Definition mit neuem Image aktualisieren
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: biztrips
          image: ${{ steps.ecr-login.outputs.registry }}/biztrips:${{ github.sha }}

      - name: ECS-Service deployen
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          cluster: biztrips-cluster
          service: biztrips-service
          wait-for-service-stability: true
